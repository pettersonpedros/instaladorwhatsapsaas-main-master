<title>Central de Cobrança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel operacional — trilho de navegação à esquerda, área de trabalho com resumo no topo e tabela logo abaixo. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#14201C; --muted:#5A6863; --line:#DAE2DF;
  --accent:#0D6B5A; --accent-ink:#FFFFFF; --accent-soft:#E0F0EB;
  --ok:#1B7A44; --ok-soft:#E1F2E7; --warn:#935E00; --warn-soft:#FAEFD8; --bad:#B3302A; --bad-soft:#FAE4E2; --info:#2A5AA3; --info-soft:#E3EBF8;
  --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 10px 30px rgba(20,32,28,.10);
  --scrim:rgba(12,20,17,.42);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E6EDEA; --muted:#98A7A1; --line:#28342F;
  --accent:#3DB399; --accent-ink:#04201A; --accent-soft:#163129;
  --ok:#4DC47F; --ok-soft:#153222; --warn:#E2A83C; --warn-soft:#332812; --bad:#EE7B71; --bad-soft:#381C1A; --info:#7FA7E9; --info-soft:#19253E;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E6EDEA; --muted:#98A7A1; --line:#28342F;
  --accent:#3DB399; --accent-ink:#04201A; --accent-soft:#163129;
  --ok:#4DC47F; --ok-soft:#153222; --warn:#E2A83C; --warn-soft:#332812; --bad:#EE7B71; --bad-soft:#381C1A; --info:#7FA7E9; --info-soft:#19253E;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:99px;font-weight:600}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted);padding:0 6px}
.mock-badge{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);padding:4px 9px;border-radius:99px;font-weight:600;font-size:11.5px;width:max-content}

main{padding-block:26px 60px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-head h1{font-size:clamp(22px,2.4vw,28px)}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.01em}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.toolbar input[type=search]{width:220px}
.toolbar select{width:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px}
.panel-body{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
.cli b{display:block;font-weight:600}
.cli .mono{color:var(--muted)}
tr.sub td{background:var(--surface-2);font-size:13px}
.itens{display:flex;flex-direction:column;gap:4px;max-width:560px}
.itens div{display:flex;justify-content:space-between;gap:16px}
.itens .neg{color:var(--ok)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;background:var(--accent-soft);color:var(--accent);font-weight:600}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:500;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip .n{opacity:.7;margin-left:4px}

.validate{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 16px;color:var(--ink)}
.validate h3{font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.validate ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}

.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--surface);border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}

.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule h3{font-size:14.5px;font-family:var(--f-body);font-weight:600}
.rule p{margin:2px 0 0;color:var(--muted);font-size:13px}
.rule .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.rule.off h3,.rule.off p{opacity:.55}
.escopo{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--surface-2);padding:10px;border-radius:8px}
.escopo label{display:flex;gap:6px;align-items:center;font-size:13px}

.regua{display:flex;flex-direction:column}
.regua-step{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.regua-step:last-child{border-bottom:0}
.regua-day{font-family:var(--f-mono);font-weight:500;text-align:center;padding:4px 0;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.drawer-head,.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2,.modal-head h2{font-size:18px}
.drawer-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.drawer-foot,.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:8px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100% - 32px));max-height:calc(100% - 40px);background:var(--surface);z-index:41;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.narrow{width:min(520px,calc(100% - 32px))}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--accent)}
.radio-card{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;align-items:flex-start}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.radio-card b{display:block}
.radio-card span{font-size:12.5px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.codebox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto}
.codebox code{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.flag{font-size:12px;color:var(--warn);display:block;margin-top:3px}
.diff-old{text-decoration:line-through;color:var(--muted)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.confirm-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.confirm-sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.confirm-sum b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* insights */
.widgets{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.w.kpi{grid-column:span 3}
.w.half{grid-column:span 6}
.w.full{grid-column:span 12}
.w h3{font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.w .big{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;border-radius:0 4px 4px 0}
.hbars{display:flex;flex-direction:column;gap:9px}
.stackbar{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}
.stackbar i{display:block;height:100%}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-row:last-child{border-bottom:0}
.custom{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.custom-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.custom-item span{flex:1;font-size:13px;min-width:0}
.custom-item .btn{padding:3px 7px}

@media (max-width:1100px){.w.kpi{grid-column:span 6}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  .w.half{grid-column:span 12}
}
@media (max-width:640px){
  .w.kpi{grid-column:span 12}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .toolbar input[type=search]{width:100%}
  .brand b{display:none}
  .hbar{grid-template-columns:90px minmax(0,1fr) 84px}
  .rule{grid-template-columns:auto minmax(0,1fr)}
  .rule>.btn,.rule>div:last-child:not(:nth-child(2)){grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">CC</div><div><b>Central de Cobrança</b><small>Financeiro · licenças</small></div></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="rail-foot">
      <span class="mock-badge">Mockup · dados de exemplo</span>
      <span>Hoje no mockup: 30/09/2026</span>
      <button class="btn sm" data-action="reset">Restaurar dados de exemplo</button>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
const HOJE='2026-09-30';
const KEY='central-cobranca-mock-v1';
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round(v*100)/100;
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK=v=>v>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':brl(v);
const nf=v=>(v||0).toLocaleString('pt-BR');
const dBR=iso=>iso?iso.slice(0,10).split('-').reverse().join('/'):'—';
const pad=n=>String(n).padStart(2,'0');
const compLabel=c=>{const[y,m]=c.split('-');return MES[+m-1]+'/'+y};
const compShort=c=>{const[y,m]=c.split('-');return MES3[+m-1]+'/'+y.slice(2)};
const prevComp=c=>{let[y,m]=c.split('-').map(Number);m--;if(!m){m=12;y--}return y+'-'+pad(m)};
const nextComp=c=>{let[y,m]=c.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+pad(m)};
const diasMes=c=>{const[y,m]=c.split('-').map(Number);return new Date(y,m,0).getDate()};
const diffDias=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const uid=p=>p+Math.random().toString(36).slice(2,8);
const digits=s=>String(s||'').replace(/\D/g,'');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

/* ---------- regras de negócio ---------- */
function aplica(r,c){return r.ativo&&(r.escopo==='todos'||r.clientes.includes(c.id))}
function regra(tipo,c,st){st=st||S;const r=st.regras.find(x=>x.tipo===tipo);return r&&aplica(r,c)?r:null}
function calcFatura(c,comp,lic,comProRata,st){
  st=st||S; lic=lic==null?c.licencas:lic; comProRata=comProRata!==false;
  const itens=[]; let fat=lic;
  const rMin=regra('minimo',c,st);
  if(rMin&&lic>0&&lic<rMin.param) fat=rMin.param;
  itens.push({d:fat+' licença'+(fat>1?'s':'')+' × '+brl(c.valor)+(fat!==lic?' (mínimo contratual; usa '+lic+')':''),v:r2(fat*c.valor)});
  if(comProRata&&regra('prorata',c,st)){
    const pc=prevComp(comp),dm=diasMes(pc);
    st.movimentos.filter(m=>m.clienteId===c.id&&m.delta>0&&m.data.startsWith(pc)).forEach(m=>{
      const dias=dm-(+m.data.slice(8))+1;
      itens.push({d:'Pro-rata +'+m.delta+' lic. de '+dBR(m.data).slice(0,5)+' a '+dm+'/'+pc.slice(5)+' ('+dias+'/'+dm+' dias)',v:r2(m.delta*c.valor*dias/dm)});
    });
  }
  const sub=itens.reduce((a,i)=>a+i.v,0);
  const aj=c.ajuste;
  if(aj&&aj.tipo!=='nenhum'&&aj.valor&&(!aj.ate||comp<=aj.ate)){
    const v=aj.tipo==='pct'?-sub*aj.valor/100:-aj.valor;
    itens.push({d:'Negociação: '+(aj.motivo||'ajuste manual')+(aj.tipo==='pct'?' ('+nf(aj.valor)+'%)':''),v:r2(v),neg:true});
  }
  return{itens,total:r2(itens.reduce((a,i)=>a+i.v,0)),venc:comp+'-'+pad(c.venc)};
}
const cli=id=>S.clientes.find(c=>c.id===id);
const pagosDe=f=>S.pagamentos.filter(p=>p.faturaId===f.id);
const pagoDe=f=>r2(pagosDe(f).reduce((a,p)=>a+p.valor,0));
function exigido(f){
  const c=cli(f.clienteId),r=c&&regra('pontualidade',c);
  const ps=pagosDe(f);
  if(r&&ps.length&&ps.every(p=>p.data<=f.venc)) return r2(f.total*(1-r.param/100));
  return f.total;
}
function status(f){
  if(!f.enviadaEm) return 'rascunho';
  const pg=pagoDe(f);
  if(pg>=exigido(f)-0.01) return 'paga';
  if(pg>0) return 'parcial';
  return HOJE>f.venc?'vencida':'aberta';
}
function saldo(f){return status(f)==='paga'?0:r2(f.total-pagoDe(f))}
function encargos(f){
  const s=saldo(f); if(!s||HOJE<=f.venc) return{multa:0,juros:0,dias:0};
  const c=cli(f.clienteId),dias=diffDias(f.venc,HOJE);
  const rm=regra('multa',c),rj=regra('juros',c);
  return{dias,multa:rm?r2(s*rm.param/100):0,juros:rj?r2(s*rj.param/100/30*dias):0};
}
function nfStatus(f){
  if(f.nf==='emitida') return 'emitida';
  if(!f.enviadaEm) return f.modo==='boleto_nf'?'no envio':'após pagamento';
  return status(f)==='paga'?'pronta':'aguardando';
}

const pill=s=>'<span class="pill '+ST_PILL[s][0]+'">'+ST_PILL[s][1]+'</span>';
function nfPill(f){

function saveCliente(){
  const f=$('#cliForm'),id=f.dataset.id;
  const val=k=>$('#'+k).value.trim();
  const nome=val('ed-nome'); if(!nome){toast('Informe a razão social do cliente.');$('#ed-nome').focus();return}
  const modo=(document.querySelector('input[name=ed-modo]:checked')||{}).value||'boleto';
  const ajuste={tipo:val('ed-ajtipo'),valor:+val('ed-ajvalor')||0,ate:val('ed-ajate'),motivo:val('ed-ajmot')};
  if(ajuste.tipo==='nenhum') ajuste.valor=0;
  const data={nome,cnpj:val('ed-cnpj'),email:val('ed-email'),valor:+val('ed-valor')||0,venc:Math.min(28,Math.max(1,+val('ed-venc')||10)),modo,ajuste};
  let c;
  if(!id){
    c=Object.assign({id:uid('c'),licencas:+val('ed-lic')||0,ativo:true,hist:[{d:HOJE,t:'Cliente cadastrado manualmente'}]},data);
    S.clientes.push(c);
    if(c.licencas) S.movimentos.push({id:uid('m'),clienteId:c.id,data:HOJE,delta:c.licencas,motivo:'Novo cliente'});
  } else {
    c=cli(id);
    const log=[];
    if(c.valor!==data.valor) log.push('Valor por licença: '+brl(c.valor)+' → '+brl(data.valor));
    if(c.modo!==data.modo) log.push('Cobrança: '+MODO[c.modo]+' → '+MODO[data.modo]);
    if(c.venc!==data.venc) log.push('Vencimento: dia '+c.venc+' → dia '+data.venc);
    const a=c.ajuste||{};
    if(a.tipo!==ajuste.tipo||a.valor!==ajuste.valor||a.ate!==ajuste.ate) log.push(ajuste.tipo==='nenhum'?'Negociação removida':'Negociação: '+(ajuste.tipo==='pct'?nf(ajuste.valor)+'%':brl(ajuste.valor))+' de desconto'+(ajuste.ate?' até '+ajuste.ate.slice(5)+'/'+ajuste.ate.slice(0,4):'')+(ajuste.motivo?' — '+ajuste.motivo:''));
    Object.assign(c,data);
    log.forEach(t=>c.hist.push({d:HOJE,t}));
  }
  document.querySelectorAll('.ed-regra').forEach(ch=>{
    const r=S.regras.find(x=>x.id===ch.value);
    const has=r.clientes.includes(c.id);
    if(ch.checked&&!has) r.clientes.push(c.id);
    if(!ch.checked&&has) r.clientes=r.clientes.filter(x=>x!==c.id);
  });
  save();closeLayer();render();toast('Cliente salvo.');
}
function addMov(){
  const id=$('#cliForm').dataset.id,c=cli(id);
  const delta=parseInt($('#mv-delta').value,10),data=$('#mv-data').value||HOJE,motivo=$('#mv-motivo').value.trim()||'Ajuste de licenças';
  if(!delta){toast('Informe a quantidade, por exemplo 3 ou -2.');$('#mv-delta').focus();return}
  if(c.licencas+delta<0){toast('O cliente tem só '+c.licencas+' licença(s).');return}
  c.licencas+=delta;
  S.movimentos.push({id:uid('m'),clienteId:id,data,delta,motivo});
  c.hist.push({d:HOJE,t:(delta>0?'+':'')+delta+' licença(s) a partir de '+dBR(data)+' — '+motivo});
  if(c.licencas===0){c.ativo=false;c.hist.push({d:HOJE,t:'Cliente ficou sem licenças e foi marcado como cancelado'})}
  save();openCliente(id);render();toast('Movimentação registrada: '+(delta>0?'+':'')+delta+' licença(s).');
}

function readFile(file){
  const rd=new FileReader();
  const isCsv=/\.csv$/i.test(file.name);
  rd.onload=e=>{
    try{
      let rows;
      if(window.XLSX){const wb=XLSX.read(isCsv?e.target.result:new Uint8Array(e.target.result),{type:isCsv?'string':'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
      else rows=parseCSV(e.target.result);
      buildDiff(rows,file.name);
    }catch(err){toast('Não consegui ler “'+file.name+'”. Salve como .xlsx ou .csv e tente de novo.')}
  };
  if(isCsv||!window.XLSX) rd.readAsText(file); else rd.readAsArrayBuffer(file);
}
function parseCSV(t){
  const lines=t.split(/\r?\n/).filter(l=>l.trim());const d=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const h=lines[0].split(d).map(s=>s.trim());
  return lines.slice(1).map(l=>{const v=l.split(d);const o={};h.forEach((k,i)=>o[k]=(v[i]||'').trim());return o});
}
function num(v){if(typeof v==='number')return v;let s=String(v||'').replace(/[^\d,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
function pick(o,keys){for(const k of Object.keys(o)){if(keys.includes(norm(k)))return o[k]}return undefined}
function parseModo(v){const s=norm(v);if(!s)return 'boleto';if(/^(so|somente|apenas)/.test(s)||s==='boleto')return 'boleto';if(s.includes('nf')||s.includes('nota'))return 'boleto_nf';return 'boleto'}
function buildDiff(rows,name){
  const out=[];const seen=new Set();
  rows.forEach(o=>{
    const r={nome:String(pick(o,['cliente','nome','razaosocial'])||'').trim(),cnpj:String(pick(o,['cnpj'])||'').trim(),licencas:Math.round(num(pick(o,['licencas','licenca','qtdlicencas','quantidade']))),valor:num(pick(o,['valorlicenca','valorporlicenca','valor','preco'])),modo:parseModo(pick(o,['modocobranca','modo','cobranca','emissao'])),venc:Math.round(num(pick(o,['diavencimento','vencimento','venc'])))||10};
    if(!r.nome&&!r.cnpj) return;
    const c=S.clientes.find(x=>(r.cnpj&&digits(x.cnpj)===digits(r.cnpj))||(!r.cnpj&&norm(x.nome)===norm(r.nome)));
    if(!c){out.push({tipo:'novo',r,ok:true});return}
    seen.add(c.id);
    const ch=[];
    if(c.licencas!==r.licencas) ch.push(['Licenças',c.licencas,r.licencas]);
    if(Math.abs(c.valor-r.valor)>0.001) ch.push(['Valor/lic.',brl(c.valor),brl(r.valor)]);
    if(c.modo!==r.modo) ch.push(['Cobrança',MODO[c.modo],MODO[r.modo]]);
    if(c.venc!==r.venc) ch.push(['Venc.','dia '+c.venc,'dia '+r.venc]);
    const flags=[];
    if(c.ajuste&&c.ajuste.tipo!=='nenhum'&&c.ajuste.valor&&ch.some(x=>x[0]==='Valor/lic.')) flags.push('Tem negociação ativa ('+(c.ajuste.tipo==='pct'?nf(c.ajuste.valor)+'%':brl(c.ajuste.valor))+'). O valor base muda e o desconto continua por cima.');
    if(ch.some(x=>x[0]==='Cobrança')&&r.modo==='boleto_nf') flags.push('Passaria a emitir NF antes do pagamento.');
    if(!c.ativo) flags.push('Cliente está cancelado; aplicar reativa o contrato.');
    out.push({tipo:ch.length?'alterado':'igual',c,r,ch,flags,ok:ch.length>0&&!flags.length});
  });
  S.clientes.filter(c=>c.ativo&&!seen.has(c.id)).forEach(c=>out.push({tipo:'ausente',c,ok:false}));
  IMP={name,rows:out};
  renderDiff();
}

  const R=IMP.rows,cnt=t=>R.filter(x=>x.tipo===t).length;
  const lab={novo:['p-info','Novo'],alterado:['p-warn','Muda'],igual:['p-mute','Sem mudança'],ausente:['p-bad','Fora da planilha']};

    '<td class="cli"><b>'+esc(x.tipo==='novo'?x.r.nome:x.c.nome)+'</b><span class="mono">'+esc(x.tipo==='novo'?x.r.cnpj:x.c.cnpj)+'</span></td><td>'+
    (x.tipo==='novo'?x.r.licencas+' lic. × '+brl(x.r.valor)+' · '+MODO[x.r.modo]+' · dia '+x.r.venc:
     x.tipo==='ausente'?'<span class="muted">Está ativo no sistema mas não veio na planilha. Marque para <b>cancelar</b> o contrato; deixe desmarcado para manter.</span>':
     x.ch.map(c=>c[0]+': <span class="diff-old">'+esc(c[1])+'</span> → <b>'+esc(c[2])+'</b>').join('<br>'))+
    (x.flags&&x.flags.length?x.flags.map(f=>'<span class="flag">⚠ '+esc(f)+'</span>').join(''):'')+'</td></tr>'}).join('');
  $('#imBody').innerHTML='<div class="toolbar"><span class="tag">'+esc(IMP.name)+'</span><span class="muted">'+R.filter(x=>x.tipo!=='ausente').length+' linhas lidas</span></div>'+
  '<div class="confirm-sum"><div><span class="lbl">Novos</span><b>'+cnt('novo')+'</b></div><div><span class="lbl">Com mudança</span><b>'+cnt('alterado')+'</b></div><div><span class="lbl">Sem mudança</span><b>'+cnt('igual')+'</b></div><div><span class="lbl">Fora da planilha</span><b>'+cnt('ausente')+'</b></div></div>'+
  '<p class="muted" style="margin:0">Linhas com ⚠ vêm desmarcadas: confira antes de aplicar. Mudança de licenças vira movimentação com data de hoje.</p>'+
  '<div class="table-wrap"><table><thead><tr><th></th><th>Situação</th><th>Cliente</th><th>O que muda</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="muted">A planilha é igual ao cadastro. Nada a aplicar.</td></tr>')+'</tbody></table></div>';
  const head=document.querySelector('.modal');
  if(!head.querySelector('.modal-foot')) head.insertAdjacentHTML('beforeend','<div class="modal-foot"><button class="btn" data-action="import">Trocar arquivo</button><button class="btn primary" data-action="imp-apply">Aplicar selecionados</button></div>');
}

  let n=0;

/* ---------- Cobrança ---------- */
function linhasComp(comp){
  const out=[];
  S.clientes.forEach(c=>{
    const st=S.faturas.find(f=>f.comp===comp&&f.clienteId===c.id);
    if(st){out.push(st);return}
    if(!c.ativo||c.licencas<=0) return;
    if(comp<'2026-10') return;
    const f=calcFatura(c,comp);
    out.push({id:'draft-'+c.id,comp,clienteId:c.id,itens:f.itens,total:f.total,venc:f.venc,enviadaEm:null,modo:c.modo,nf:null,draft:true});
  });
  return out;
}

  const cnt={todos:L.length,paga:0,aberta:0,vencida:0,parcial:0,nf:0};

    '<td class="r num">'+(sd?brl(sd):'—')+(e.dias?'<span class="flag">'+e.dias+' dias · atualizado '+brl(sd+e.multa+e.juros)+'</span>':'')+'</td>'+

  return '<div class="page-head"><div><h1>Conciliação</h1><p>Quem pagou, quem não pagou e quais notas estão liberadas para emissão. A baixa pode vir do banco ou ser registrada em Pagamentos.</p></div><div class="toolbar"><select id="concComp" aria-label="Competência">'+opts+'</select><button class="btn" data-action="rel-now" data-id="">Gerar relatório</button></div></div>'+

  '<div class="stat bad"><span class="lbl">Vencido</span><span class="v">'+brl(k.ven)+'</span><span class="sub">+ '+brl(k.enc)+' de multa e juros</span></div></div>'+

const CONT={resumo:'Resumo',pagos:'Pagos',abertos:'A vencer',vencidos:'Vencidos',nf:'NFs pendentes'};
function proxRel(a){
  if(a.freq==='datas') return a.datas.filter(d=>d>=HOJE).sort()[0]||'';

  return d<=a.dia?y+'-'+pad(m)+'-'+pad(a.dia):nextComp(y+'-'+pad(m))+'-'+pad(a.dia);
}

  const mx=niceMax(Math.max(...s.map(x=>x.fat))*1.05),gw=iw/s.length,bw=Math.min(22,gw/2-5);
  let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+='<line class="gl" x1="'+pl+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+(mx*i/4/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil</text>'}
  s.forEach((d,i)=>{
    const cx=pl+gw*i+gw/2;
    const hf=d.fat/mx*ih,hr=d.rec/mx*ih;
    g+='<path d="'+topRound(cx-bw-1,pt+ih-hf,bw,hf,4)+'" fill="var(--s1)"'+(d.proj?' fill-opacity=".35"':'')+'><title>'+compLabel(d.comp)+' · faturado '+brl(d.fat)+(d.proj?' (previsto)':'')+'</title></path>';
    if(hr>0) g+='<path d="'+topRound(cx+1,pt+ih-hr,bw,hr,4)+'" fill="var(--s2)"><title>'+compLabel(d.comp)+' · recebido '+brl(d.rec)+'</title></path>';
    g+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle"'+(d.comp===UI.insComp?' style="fill:var(--ink);font-weight:600"':'')+'>'+compShort(d.comp)+(d.proj?'*':'')+'</text>';
  });
  return '<div class="legend"><span><i style="background:var(--s1)"></i>Faturado</span><span><i style="background:var(--s2)"></i>Recebido</span><span>* previsto, ainda não enviado</span></div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Faturado e recebido por mês">'+g+'</svg></div>';
}
function chartLine(s){
  const W=560,H=200,pl=40,pr=40,pb=24,pt=20,iw=W-pl-pr,ih=H-pb-pt;
  const vals=s.map(x=>x.lic),mn=Math.floor((Math.min(...vals)-10)/10)*10,mx=Math.ceil((Math.max(...vals)+10)/10)*10;
  const X=i=>pl+(s.length===1?iw/2:iw*i/(s.length-1)),Y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>'}
  const pts=s.map((d,i)=>X(i)+','+Y(d.lic)).join(' ');
  g+='<polygon points="'+X(0)+','+(pt+ih)+' '+pts+' '+X(s.length-1)+','+(pt+ih)+'" fill="var(--s1)" fill-opacity=".10"/>';
  g+='<polyline points="'+pts+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>';
  s.forEach((d,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(d.lic)+'" r="'+(i===s.length-1?5:3)+'" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>'+compLabel(d.comp)+': '+d.lic+' licenças</title></circle><circle cx="'+X(i)+'" cy="'+Y(d.lic)+'" r="14" fill="transparent"><title>'+compLabel(d.comp)+': '+d.lic+' licenças</title></circle><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+compShort(d.comp)+'</text>'});
  const l=s[s.length-1];g+='<text x="'+(X(s.length-1))+'" y="'+(Y(l.lic)-12)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+l.lic+'</text>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Licenças ativas por mês">'+g+'</svg></div>';
}
function vInsights(){
  const opts=comps().filter(c=>S.faturas.some(f=>f.comp===c)).map(c=>'<option value="'+c+'"'+(c===UI.insComp?' selected':'')+'>'+compLabel(c)+'</option>').join('');
  const on=S.widgets.filter(w=>w.on);
  const edit=UI.insEdit?'<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Personalizar painel</h2><span class="muted">Marque o que aparece e use as setas para ordenar</span></div><div class="panel-body"><div class="custom">'+
    S.widgets.map((w,i)=>'<div class="custom-item"><input type="checkbox" id="w-'+w.id+'" data-action="w-on" data-id="'+w.id+'"'+(w.on?' checked':'')+' style="accent-color:var(--accent)"><span><label for="w-'+w.id+'">'+WDEF[w.id][0]+'</label></span><button class="btn sm" data-action="w-up" data-i="'+i+'" aria-label="Subir"'+(i?'':' disabled')+'>↑</button><button class="btn sm" data-action="w-dn" data-i="'+i+'" aria-label="Descer"'+(i<S.widgets.length-1?'':' disabled')+'>↓</button></div>').join('')+'</div></div></div>':'';
  return '<div class="page-head"><div><h1>Insights de '+compLabel(UI.insComp)+'</h1><p>Faturamento e recebimento do mês. Escolha os blocos que o seu financeiro quer acompanhar; a escolha fica salva neste navegador.</p></div><div class="toolbar"><select id="insComp" aria-label="Mês">'+opts+'</select><button class="btn'+(UI.insEdit?' primary':'')+'" data-action="ins-edit">'+(UI.insEdit?'Concluir':'Personalizar')+'</button></div></div>'+edit+
  '<div class="widgets">'+on.map(w=>'<section class="w '+WDEF[w.id][1]+'"><h3>'+WDEF[w.id][0]+'</h3>'+wBody(w.id)+'</section>').join('')+'</div>'+
  '<div style="margin-top:16px">'+validateBox(['Quais 4 números o financeiro olha primeiro todo mês? Esses viram os blocos do topo.','Inadimplência deve ser medida sobre o <b>valor</b> ou sobre o <b>número de clientes</b>?','Precisa comparar com meta de faturamento? Quem define a meta?'])+'</div>';
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-action]'); if(!t) return;
  if(t.dataset.tab){UI.tab=t.dataset.tab;try{localStorage.setItem(KEY+'-tab',UI.tab)}catch(_){}render();window.scrollTo(0,0);return}
  const a=t.dataset.action,id=t.dataset.id;
  if(t.tagName==='INPUT') return; // tratados em change
  switch(a){
    case'close':closeLayer();break;
    case'reset':S=seed();save();UI.cobSel=null;render();toast('Dados de exemplo restaurados.');break;
    case'modo':{const c=cli(id);if(c.modo!==t.dataset.v){c.hist.push({d:HOJE,t:'Cobrança: '+MODO[c.modo]+' → '+MODO[t.dataset.v]});c.modo=t.dataset.v;save();render();toast(c.nome+': '+MODO[c.modo]+'.')}break}
    case'edit-cli':openCliente(id);break;
    case'save-cli':saveCliente();break;
    case'mov-add':addMov();break;
    case'cancel-cli':{const c=cli(id);if(t.dataset.confirm){S.movimentos.push({id:uid('m'),clienteId:id,data:HOJE,delta:-c.licencas,motivo:'Cancelamento do contrato'});c.hist.push({d:HOJE,t:'Contrato cancelado (-'+c.licencas+' licenças)'});c.licencas=0;c.ativo=false;save();closeLayer();render();toast(c.nome+' cancelado.')}else{t.dataset.confirm='1';t.textContent='Confirmar cancelamento';t.classList.add('primary');t.style.background='var(--bad)';t.style.borderColor='var(--bad)';t.style.color='var(--surface)'}break}
    case'import':openImport();break;
    case'imp-sample':buildDiff(SAMPLE,'licencas-outubro-2026.xlsx');break;
    case'imp-apply':applyImport();break;
    case'copy-hdr':copy(HEADER,'Cabeçalho copiado.');break;
    case'regra-esc':{const r=S.regras.find(x=>x.id===id);r.escopo=t.dataset.v;if(r.escopo==='selecionados')UI.regraOpen[id]=true;save();render();break}
    case'regra-open':UI.regraOpen[id]=!UI.regraOpen[id];render();break;
    case'nova-regra':openNovaRegra();break;
    case'save-regra':saveRegra();break;
    case'cob-open':UI.cobOpen[id]=!UI.cobOpen[id];render();break;
    case'cob-all':{const d=linhasComp(UI.cobComp).filter(f=>f.draft);if(UI.cobSel.ids.size===d.length)UI.cobSel.ids.clear();else d.forEach(f=>UI.cobSel.ids.add(f.id));render();break}
    case'send-open':openSend();break;
    case'send-go':doSend();break;
    case'emitir-nf':{const f=S.faturas.find(x=>x.id===id);emitirNF(f);save();render();toast('NF '+f.nfNum+' emitida para '+cli(f.clienteId).nome+'.');break}
    case'conc-f':UI.concF=t.dataset.v;render();break;
    case'pay-for':PAYPRE=id;UI.tab='pagamentos';render();window.scrollTo(0,0);break;
    case'pay-del':{const p=S.pagamentos.find(x=>x.id===id);if(t.dataset.confirm){S.pagamentos=S.pagamentos.filter(x=>x.id!==id);save();render();toast('Pagamento estornado.')}else{t.dataset.confirm='1';t.textContent='Confirmar estorno'}break}
    case'cfg-nf':S.config.nfAoPagar=t.dataset.v;save();render();break;
    case'rel-now':openRelatorio(id);break;
    case'rel-del':S.agenda=S.agenda.filter(x=>x.id!==id);save();render();toast('Agendamento removido.');break;
    case'rel-new':openNovoRel();break;
    case'rl-freq':{document.querySelectorAll('[data-action=rl-freq]').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#rl-datas').hidden=t.dataset.v!=='datas';$('#rl-mensal').hidden=t.dataset.v==='datas';break}
    case'rl-add':{const d=$('#rl-data').value;if(d&&!NEWREL.includes(d)){NEWREL.push(d);NEWREL.sort()}$('#rl-chips').innerHTML=NEWREL.map(x=>'<span class="tag">'+dBR(x)+'</span>').join('');break}
    case'rl-save':{
      const nome=$('#rl-nome').value.trim()||'Relatório de conciliação';
      const freq=document.querySelector('[data-action=rl-freq][aria-pressed=true]').dataset.v;
      if(freq==='datas'&&!NEWREL.length){toast('Adicione pelo menos uma data.');break}
      const conteudo=[...document.querySelectorAll('.rl-c:checked')].map(x=>x.value);
      if(!conteudo.length){toast('Escolha o que vai no relatório.');break}
      S.agenda.push({id:uid('a'),nome,freq,datas:NEWREL.slice(),dia:+$('#rl-dia').value||5,conteudo,emails:$('#rl-emails').value.trim()});
      save();closeLayer();render();toast('Relatório agendado.');break}
    case'rp-copy':{const L=relRows();const csv=['cliente;vencimento;valor;pago;saldo;situacao;nf'].concat(L.map(f=>[cli(f.clienteId).nome,dBR(f.venc),f.total.toFixed(2).replace('.',','),pagoDe(f).toFixed(2).replace('.',','),saldo(f).toFixed(2).replace('.',','),ST_PILL[status(f)][1],nfStatus(f)].join(';'))).join('\n');copy(csv,'Relatório copiado. Cole no Excel ou Google Planilhas.');break}
    case'ins-edit':UI.insEdit=!UI.insEdit;render();break;
    case'w-up':case'w-dn':{const i=+t.dataset.i,j=a==='w-up'?i-1:i+1;[S.widgets[i],S.widgets[j]]=[S.widgets[j],S.widgets[i]];save();render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.action,id=t.dataset.id;
  if(t.id==='fModo'){UI.fModo=t.value;render()}
  else if(t.id==='fAtivo'){UI.fAtivo=t.value;render()}
  else if(t.id==='cobComp'){UI.cobComp=t.value;render()}
  else if(t.id==='concComp'){UI.concComp=t.value;render()}
  else if(t.id==='insComp'){UI.insComp=t.value;render()}
  else if(t.id==='payComp'){UI.payComp=t.value;render()}
  else if(t.id==='pf-cli'){fillFat()}
  else if(t.id==='pf-fat'){fillValor()}
  else if(t.id==='rp-de'||t.id==='rp-ate'){renderRel()}
  else if(a==='regra-on'){S.regras.find(x=>x.id===id).ativo=t.checked;save();render()}
  else if(a==='regra-param'){S.regras.find(x=>x.id===id).param=+t.value||0;save();render()}
  else if(a==='regra-cli'){const r=S.regras.find(x=>x.id===id);r.clientes=t.checked?[...new Set(r.clientes.concat(t.dataset.c))]:r.clientes.filter(x=>x!==t.dataset.c);save()}
  else if(a==='regua-on'){S.regua.find(x=>x.id===id).ativo=t.checked;save()}
  else if(a==='cob-sel'){t.checked?UI.cobSel.ids.add(id):UI.cobSel.ids.delete(id);render()}
  else if(a==='w-on'){S.widgets.find(w=>w.id===id).on=t.checked;save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='payForm')savePay(e);else e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)closeLayer()});
function copy(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>toast('Não consegui copiar. Selecione o texto e use Ctrl+C.'))}catch(_){toast('Não consegui copiar. Selecione o texto e use Ctrl+C.')}}

load();render();
})();
</script>
